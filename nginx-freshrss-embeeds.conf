## Configuración SWAG para FreshRSS Embeds
## Coloca este archivo en: /path/to/swag/config/nginx/proxy-confs/freshrss-embeeds.subdomain.conf
## (o .subfolder.conf si usas subfolder en lugar de subdominio)
##
## Ajusta 'server_name' con tu dominio y la IP/puerto del servidor donde corre serve.py


## --- OPCIÓN A: Subdominio (ej. embeds.tudominio.com) ---

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name embeds.*;

    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # IP del servidor donde corre serve.py (o 172.17.0.1 si es el host Docker)
        set $upstream_app 192.168.1.100;
        set $upstream_port 8765;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}


## --- OPCIÓN B: Subfolder (ej. tudominio.com/embeds/) ---
